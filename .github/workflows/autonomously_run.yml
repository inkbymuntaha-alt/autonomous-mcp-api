name: Autonomous Execution Loop

on:
  schedule:
    - cron: '0 9 * * *' # Runs automatically every day at 9:00 UTC
  workflow_dispatch: # Allows you to trigger it manually anytime from your phone browser

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests web3 pydantic fastapi uvicorn

      - name: Execute Autonomous Outreach Agent
        run: python outreach_agent.py
