name: Autonomous Execution Loop

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically
  workflow_dispatch:       # Allows manual trigger anytime

jobs:
  run-outreach-and-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pipeline Execution
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python outreach_agent.py

      - name: Broadcast Manifest to Agent Registries
        run: python register_discovery.py
